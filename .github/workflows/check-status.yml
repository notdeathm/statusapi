name: Check Status

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run status checks
        id: checks
        run: node scripts/check-status.js

      - name: Send Email Notification (Outage)
        if: steps.checks.outputs.outage_detected == 'true' && env.MAIL_SERVER != ''
        continue-on-error: true
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚨 Status Alert: Service Outage Detected"
          body: |
            A service outage has been detected:

            Services affected:
            ${{ steps.checks.outputs.failing_services }}

            Dashboard:
            https://notdeathm.github.io/statusapi/
          to: notdeath@duck.com
          from: Status API Bot <${{ secrets.MAIL_USERNAME }}>

      - name: Send Discord Notification (Outage)
        if: steps.checks.outputs.outage_detected == 'true' && env.DISCORD_WEBHOOK != ''
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "🚨 Service Outage Detected",
                "description": "The following services are down:\n**${{ steps.checks.outputs.failing_services }}**",
                "color": 15548997,
                "fields": [
                  {
                    "name": "Dashboard",
                    "value": "https://notdeathm.github.io/statusapi/",
                    "inline": false
                  }
                ],
                "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
              }]
            }'

      - name: Send Discord Notification (Degraded)
        if: steps.checks.outputs.degraded_detected == 'true' && steps.checks.outputs.outage_detected != 'true' && env.DISCORD_WEBHOOK != ''
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "⚠️ Service Degraded",
                "description": "The following services are experiencing high latency:\n**${{ steps.checks.outputs.degraded_services }}**",
                "color": 16776960,
                "fields": [
                  {
                    "name": "Dashboard",
                    "value": "https://notdeathm.github.io/statusapi/",
                    "inline": false
                  }
                ],
                "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
              }]
            }'

      - name: Commit updated status files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Status Bot"
          
          git add public/
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: update status $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
